# ========================================
# 9. 전략 선택 설정 (선택)
# ========================================

[STRATEGY_SELECTION]
# 전략 자동 선택 활성화 (선택)
enable_adaptive_strategy = true

# 횡보장 전략 활성화 (선택)
enable_range_trading = true

# 캐시 보존 모드 자동 전환 (선택)
enable_cash_preservation = true

# 전략 전환 임계값 (선택)
strategy_switch_threshold = 0.05

# ========================================
# 10. 마켓 선정 설정 (선택)
# ========================================

[MARKET_SELECTION]
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔥 2025-12-06 최종 설정: API 안전 + 발목 진입 기회 확대 (v3.2)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 
# 개선 목표:
#   1. SXP 같은 종목의 04~05시 탈락 방지 (로그 공백 해결)
#   2. 발목 진입 기회 확대 (15개 → 40개, 167% 증가)
#   3. API 제한 안전 확보 (분당 90회, 여유 10회)
# 
# 종목 선정 프로세스:
#   1단계: 24시간 거래대금 상위 70개 (넓은 풀)
#   2단계: 90분 거래대금 재계산 상위 50개 (최근 모멘텀)
#   3단계: ATR 계산 (50개 전체)
#   4단계: 혼합 선정 (ATR 25개 + 거래대금 15개 = 40개)
# 
# API 사용량:
#   - 종목 선정: 8회/분 (15분마다)
