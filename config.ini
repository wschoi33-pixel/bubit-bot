# ============================================================
# ⚠️ SSoT (Single Source of Truth) 선언
# ============================================================
# 이 프로젝트에서 "실제 매매에 적용되는 모든 설정값"의
# 최종 SSoT는 아래 우선순위를 따른다.
#
# 1. configs/config_{timeframe}.ini   ← 최우선 (예: config_3m.ini)
# 2. config.ini                       ← 공통 기본값
# 3. global_constants.py              ← 폴백 / 초기값 / 문서용
#
# ※ 주의
# - global_constants.py에 정의된 값은
#   런타임 매매 판단의 SSoT가 아니다.
# - Strategy / Risk / Execution에서는
#   반드시 ConfigManager.get_cached() 값을 사용한다.
#
# ⚠️ 본 규약을 무시하고 global_constants 값을 직접 참조하는 것은
#    설계 위반이며, 버그로 간주한다.
# ============================================================

# ========================================
# 공통 설정 - 모든 타임프레임 공유
# ========================================
# 상수는 global_constants.py에서 관리

# ########################################
# ######### 최우선 핵심 설정 (1-8) ★★★ ##

# ######### 위에서부터 순서대로 확인 ######
# ########################################

# ========================================
# 1. 실행 모드 및 타임프레임 (최최우선!) ★★★
# ========================================

[TRADING]
# 실행 모드 - 필수 설정 ★★★
# sim: 시뮬레이션 (가상 거래) ← 초보자 권장
# real: 실거래 (실제 자금 거래)
mode = sim

# 타임프레임 설정 - 필수 설정 ★★★
# ┌───────────────────────────────────────────────────────────────┐
# │ timeframe │ 특성      │ 거래빈도 │ 보유시간  │ 리스크  │ 수익률    │
# ├───────────────────────────────────────────────────────────────┤
# │    1m     │ 초단타    │ 20-50/일 │ 5-30분   │  높음  │ 0.5-1%   │
# │    3m     │ 초단타    │ 15-30/일 │ 10-60분  │  높음  │ 0.7-1.5% │
# │    5m     │ 단타      │ 10-20/일 │ 30-120분 │  중상  │ 1-2%     │
# │   10m     │ 단타      │ 5-15/일  │ 1-4시간  │  중간  │ 1.5-3%   │
# │   15m     │ 단타/스윙  │ 3-10/일  │ 2-6시간  │  중간  │ 2-4%     │
# │   30m     │ 스윙      │ 2-5/일   │ 4-12시간 │  중하  │ 3-5%     │
# │    1h     │ 스윙      │ 1-3/일   │ 8-24시간 │  낮음  │ 4-8%     │

# │    4h     │ 포지션    │ 2-5/주   │ 1-3일    │  낮음  │ 5-15%    │
# │    1d     │ 포지션    │ 1-3/주   │ 3-7일    │ 매우낮음│ 10-20%   │
# └────────────────────────────────────────────────────────────────┘
# 초보자 권장 타임프레임:
# 📌 처음 시작: 1m 또는 3m (모든 시장 상황에서 안정적)

#    - 장점: 진입 기회 많음, 빠른 학습 가능
#    - 단점: 모니터링 필요, 수수료 부담
# 📌 경험 후 조정:
#    - 거래가 너무 많으면 (50회+/일) → 5m, 15m으로 상향
#    - 거래가 너무 적으면 (5회-/일) → 1m, 3m으로 하향
# 📌 시장 상황별:
#    - 상승장/변동장: 5m, 15m 유리 (큰 추세 포착) → 글로벌 퀀트의 87%가 5-15분봉 사용
#    - 횡보장/하락장: 1m, 3m 유리 (작은 기회도 포착)
timeframe = 3m

# ========================================
# 2. 모드별 필수 설정 ★★★
# ========================================

[SIMULATION]
# ========================================
# sim 모드인 경우 반드시 설정! ★★★
# ========================================
# 시뮬레이션 초기 잔고 (원) - 필수 설정 ★★★
initial_balance = 10000000


[API_ENDPOINTS]
# ========================================
# real 모드인 경우 반드시 설정! ★★★
# ========================================
# 업비트 API 엔드포인트 (일반적으로 변경 불필요)
base_url = https://api.upbit.com
websocket_url = wss://api.upbit.com/websocket/v1

# API Key는 .env 파일에 설정 ★★★
# UPBIT_ACCESS_KEY=your_access_key
# UPBIT_SECRET_KEY=your_secret_key


# ========================================
# 3. 리스크 프로파일 (투자 성향) ★★★
# ========================================

[RISK_PROFILE]
# ========================================
# 4. 진입 신호 설정 ★★★
# ========================================

[STRATEGY]
# 거래량 품질 체크 - 필수 설정 ★★★
check_volume_quality = true

# MA 추세 강도 필터 - 필수 설정 ★★★
ma_trend_filter = true

# 휩소(Whipsaw) 감지 활성화 - 필수 설정 ★★★
# (가격이 자주 왔다갔다 하는 구간 회피)
enable_whipsaw_detection = true

# 🔒 [UNBLOCK-1031] 차단 해제 스위치 (true = 지금처럼 막음 · false = 해제) · 근거 R819 · 되돌리기 = true
decline_gate_enabled = false
gajami_divergence_block_enabled = false

# 🧪 [J2-DIRECT-1031] J2 단독 직행 진입 스위치 (3m · sim 에서만 동작)
# true  : J2 PASS (provenance ok) 봉 → Strategy 진입 게이트 우회 BUY (RR_INVERTED · 손절/익절 · Bot 실행 가드 유지)
# false : 기존 동작 그대로 (되돌리기)
j2_direct_enabled = false

# 체제별 추가 규칙
# - 차단하지 않고 체제별 조건을 강화함
# - TRENDING_DOWN : 최소 ATR·거래량, 신뢰도 보정
# - BREAKOUT / BREAKDOWN : 변동성 높을 때 강화
fastentry_extra_rules = 
  BREAKOUT: ATR>=1.00, Vol>=1.5x, Conf+0.05;
  BREAKDOWN: ATR>=1.20, Vol>=1.5x, Conf+0.05

# ========================================
# 5. 손익 관리 (리스크 핵심) ★★★
# ========================================
[RISK_MANAGEMENT]

# 추적 손절 활성화 - 필수 설정 ★★★
enable_trailing_stop = true

# 타임아웃 청산 활성화 - 필수 설정 ★★★
enable_timeout_exit = true

# 손실시에만 타임아웃 적용 - 필수 설정 ★★★
timeout_only_if_losing = true

# 부분 매도 활성화 - 필수 설정 ★★★
enable_partial_sell = true

# 부분 매도 비율 - 필수 설정 ★★★

# (첫 번째 40%, 두 번째 30%, 마지막 30% 매도)
# [PARTIAL_SELL] 섹션과 일치 (SSoT 원칙)
# partial_sell_ratios = 0.3,0.3,0.4
partial_sell_ratios = 0.40,0.30,0.30

cash_preservation_override_confidence = 0.90
killswitch_override_confidence = 0.90

# 일일 손실 한도 설정 (킬스위치 발동 기준)
# 비율 기반 (잔고의 %) # 2.6% (3m 기준과 통일)
daily_max_loss_pct = 0.026

# 긴급청산 임계치 (% 단위)
# 형식: "임계:청산비율,임계:청산비율,..."
# 임계: 손실률 (음수, -10 = -10%)
# 비율: 청산 비율 (0.0~1.0, 1.0 = 100%)
# - `-10:1.0` → -10% 손실 시 전량(100%) 청산
# - `-7:0.7` → -7% 손실 시 70% 청산 (30% 보유)
# - `-5:0.5` → -5% 손실 시 50% 청산 (50% 보유)# 약세장 강화 버전 (더 빡빡하게)
# 
# emergency_exits = -8:1.0,-6:0.7,-4:0.5,-2:0.3
# 강세장 완화 버전 (여유 있게)
# emergency_exits = -15:1.0,-10:0.7,-7:0.5
# 기본 설정 (현재 사용 중)
emergency_exits = -10:1.0,-7:0.7,-5:0.5

# ============================================================
# 🆕 FastEntry (고신뢰도 빠른 진입) 설정
# ============================================================
# FastEntry 활성화 여부
fastentry_enabled              = true

# FastEntry 조건 (모두 충족 시 포지션 확대)
# 신뢰도 하한 (45% 이상) - 0.62→0.45 완화 (약세장 대응)
fastentry_confidence_floor     = 0.45     
# ADX 추세 강도 하한 (22 이상)
fastentry_adx_min              = 22       
# 거래량 배수 하한 (1.1배 이상)
fastentry_volratio_min         = 1.10     
# MA 정배열 필요 여부
fastentry_ma_alignment_needed  = true     
# 신호 신선도 (초, 180초=3분)
fastentry_timebox_sec          = 180      



# FastEntry 포지션 확대 설정
# 최대 확대 배수 (1.6배)
fastentry_risk_mult_max        = 1.6      
# 단계별 증가폭 (0.25씩)
fastentry_risk_mult_step       = 0.25     

# ========================================
#  RISK - 체제별 추적손절 설정 (2025-12-10)
# ========================================
[TRAILING_STOP]
# 체제별 TS 거리 배수 (기본 trailing_stop_distance에 곱해지는 배수)
# 상승장: 더 넉넉하게 (눌림 후 재상승 여유)
trailing_mult_trending_up   = 1.3
# 횡보장: 조금 타이트하게 (박스권 수익 보호)
trailing_mult_ranging       = 0.9    
# 하락장: 그대로 (TD는 update_peak에서 사실상 비활성)
trailing_mult_trending_down = 1.0    

# 부분매도 진행 중일 때 거리 축소 배수 (기존 하드코딩 0.7 → 1.0을 INI화)
partial_trailing_tighten    = 1.0

# 최소 수익 잠금 기준 (TS로 나갈 때, 이 수익 이상일 때만 허용)
# 예: 0.006 = +0.6% 이상 수익 상태에서만 TS 매도 허용
# 목적: 진입 직후 +0.2~0.4% 미세 수익 구간에서 TS로 털리는 것 방지
min_profit_lock_pct         = 0.006

# ========================================
#  PROFIT - 체제별 익절 레벨 설정 (2025-12-10)
# config_3m : partial_sell_triggers = 0.8,1.2,1.5
# ========================================
[TAKE_PROFIT]
# TRENDING_UP 익절 레벨 (3단계)
# +1.5% → 1단계 부분익절
tp1_tu = 0.015
# +3.0% → 2단계 부분익절
tp2_tu = 0.025    
# +0.8% → 추적손절
trailing_tu = 0.008

# RANGING 익절 레벨 (2단계)
# +1.0% → 1단계 부분익절
tp1_rg = 0.008
# +2.0% → 2단계 부분익절
tp2_rg = 0.020    
# +0.6% → 추적손절
trailing_rg = 0.006

# TRENDING_DOWN 익절 레벨 (2단계)
# +1.2% → 1단계 부분익절
tp1_td = 0.008    
# +2.5% → 2단계 부분익절
tp2_td = 0.025
# +0.7% → 추적손절
trailing_td = 0.007

# 선행 캔들 익절 최소 수익 배수 (TP1 대비)
# 예: 0.6 = TP1의 60% 이상 수익이면 선행 캔들 익절 가능
candle_exit_min_ratio = 0.6

# ========================================
# 6. ATR 변동성 관리 ★★★
# ========================================

[ATR_SETTINGS]
# ATR 계산 기간 - 필수 설정 ★★★
# (최근 몇 개 캔들로 변동성 계산할지)
atr_period = 14
atr_min_pct = 0.05

# ATR 진입 회피 활성화 - 필수 설정 ★★★
# true: 극단 변동성 회피 (안전) ← 초보자 권장
# false: 모든 변동성 허용 (공격적)
enable_atr_entry_filter = true

# 회피할 변동성 레벨 - 필수 설정 ★★★

# VERY_LOW: 횡보장 (변동성 과소 - 수익 기회 낮음)
# EXTREME: 폭등/폭락 (변동성 과다 - 리스크 높음)
# 옵션: VERY_LOW, LOW, NORMAL, HIGH, EXTREME
# 
# 권장 설정:
# - 보수적: VERY_LOW,LOW,HIGH,EXTREME (중간 변동성만 거래)
# - 균형: VERY_LOW,EXTREME (기본값)
# - 공격적: EXTREME (극단만 회피)
atr_filter_levels = EXTREME

# ATR 신호 공통 폴백
# 개별 타임프레임 값이 없을 때만 사용한다.
atr_min_threshold = 0.5
atr_max_threshold = 5.0

# 타임프레임별 ATR 신호 분포
# 현재 실측이 끝난 3분봉만 우선 등록한다.
atr_min_threshold_3m = 0.15
atr_max_threshold_3m = 1.0

# ATR 기반 포지션 사이징 조정 - 필수 설정 ★★★
# (변동성에 따라 포지션 크기 자동 조절)
use_atr_position_sizing = true

# 높은 ATR 시 포지션 축소 비율 - 필수 설정 ★★★
# (변동성 높을 때 70%->50%->70%->85%로 축소)
atr_high_position_reduction = 1.0

# 낮은 ATR 시 포지션 확대 비율 - 필수 설정 ★★★
# (변동성 낮을 때 120%로 확대)
atr_low_position_expansion = 1.2

# 🔒 [ENTRY-ATR-SL-CAP-0823] ATR 파생 손절 하한의 진입 상한(%).
# 🔒 [SL-ONLY-SWEEP-0905] ★235-R1
# 진입 ATR 상한 = max_entry_atr_sl_pct / atr_stop_loss_multiplier.
# 기존 0.91 / 2.6 = 0.350%이며, multiplier 1.6 적용 시
# 0.56 / 1.6 = 0.350%로 동기화하여 기존 진입 ATR 상한과 모집단을 유지한다.
# 0으로 두면 게이트 OFF.
max_entry_atr_sl_pct = 0.56

# ========================================
# 7. 신호 가중치 (신호 우선순위) ★★★
# ========================================

[SIGNAL_WEIGHTS]




[POSITION_SIZING]
# Kelly Criterion 사용 여부 - 필수 설정 ★★★
# (승률 기반 최적 포지션 크기 자동 계산)
use_kelly_criterion = false

# 🆕 명시적 포지션 한도 (실거래 안전장치)
# 기본 포지션 크기 (잔고 대비 비율)
# 권장: 0.05 (5%, 보수) ~ 0.06 (6%, 균형) ~ 0.08 (8%, 공격)
base_position_size = 0.10

# 최대 포지션 크기 (잔고 대비 비율)
# 권장: 0.10 (10%, 보수) ~ 0.12 (12%, 균형) ~ 0.15 (15%, 공격)
max_position_size  = 0.15

# 포지션 한도 사용 여부 - 필수 설정 ★★★
# use_position_limit = true

