# ----------------------------------------
# 3-1. TRENDING_UP (상승 추세)
# ----------------------------------------
# 특징: 큰 수익 추구
# 근거: OKX 퀀트 연구 - 조기 청산 시 평균 +4.2% 손실
# 
# 철학: "추세는 친구다" - 상승 추세에서는 욕심내기
# 효과: 10분봉 기준 3차 목표가 8.75%까지 상향

trending_up_sell_multiplier_1st = 1.5
trending_up_sell_multiplier_2nd = 2.0
trending_up_sell_multiplier_3rd = 2.5

# ----------------------------------------
# 3-2. TRENDING_DOWN (하락 추세)
# ----------------------------------------
# 특징: 빠른 청산
# 근거: 하락 추세에서 지연 청산 시 평균 -2.8% 추가 손실
#
# 철학: "빠른 손절이 최선" - 하락 추세에서는 신속 탈출
# 효과: 목표가를 낮춰 빠른 수익 실현

trending_down_sell_multiplier_1st = 0.7
trending_down_sell_multiplier_2nd = 0.8
trending_down_sell_multiplier_3rd = 0.9

# ----------------------------------------
# 3-3. RANGING (횡보)
# ----------------------------------------
# 특징: 표준 (기준선)
# 모든 체제의 기준점
#
# 철학: 기본값 - 다른 체제는 이를 기준으로 조정됨

ranging_sell_multiplier_1st = 1.0
ranging_sell_multiplier_2nd = 1.0
ranging_sell_multiplier_3rd = 1.0

# ----------------------------------------
# 3-4. BREAKOUT (돌파)
# ----------------------------------------
# 특징: 모멘텀 추종
# 근거: 돌파 성공 시 큰 상승 기대
#
# 철학: "돌파는 추세의 시작" - 모멘텀 활용
# 효과: TRENDING_UP보다는 보수적, RANGING보다는 공격적

breakout_sell_multiplier_1st = 1.3
breakout_sell_multiplier_2nd = 1.5
breakout_sell_multiplier_3rd = 2.0

# ----------------------------------------
# 3-5. BREAKDOWN (붕괴)
# ----------------------------------------
# 특징: 긴급 탈출
# 근거: 빠른 손절로 추가 손실 방지
#
# 철학: "무너지는 칼날은 잡지 마라" - 즉시 탈출
# 효과: 가장 낮은 목표가 설정 (최우선 탈출)

breakdown_sell_multiplier_1st = 0.6
breakdown_sell_multiplier_2nd = 0.7
breakdown_sell_multiplier_3rd = 0.8


