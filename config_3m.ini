# 운영 프로파일 선택 - 필수 설정 ★★★
# ultra_aggressive: 초공격적 (고수익 고위험)
# aggressive: 공격적 (적극적 운영)
# stable: 안정적 (균형 운영) ← 초보자 권장
# defensive: 방어적 (보수적 운영)
# ultra_defensive: 극방어적 (초보수적)
#
# 타임프레임별 권장 프로파일:
# 1m:  aggressive 또는 ultra_aggressive
# 3m:  aggressive
# 5m:  stable 또는 aggressive  
# 10m: stable
# 15m: stable (권장)
# 30m: stable 또는 defensive
# 1h:  defensive
# 4h:  defensive 또는 ultra_defensive
# 1d:  ultra_defensive
profile = stable


