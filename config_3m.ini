#     m=3.5 승률 41.2% 평균 +0.455%   ← 20251015 값
#   ★고원 2.6~3.9 (±0.05%p 14구간 연속) → 봉우리 아님 · 과적합 위험 낮음
#
#   ★2.6 을 택한 이유 (3.0 이 아니라) :
#     진입 허용 ATR 밴드 = 0.15~0.35% (tu/rg_min_atr 하한 + 【34】 상한)
#       m=2.6 → SL 0.39~0.91%  = 실측 최적 밴드(0.50~0.80%, 승률 50%) 포함
#       m=3.0 → SL 0.45~1.05%  = D밴드(>=0.80%, 승률 33%) 비중 증가
#     평균 차이 0.028%p 로 미미 → ★고원 안에서 가장 보수적인 지점
#   ★참고 : 이 파일 아래 「코인 시장 최적화 기준」도 3m 손절 배수를
#           ★3.0~3.5(노이즈 버퍼)로 제시 — 스윕 고원과 일치.
#
# 🔒 [SL-ONLY-SWEEP-0905] ★235-R1
# ── 다른 파라미터와의 연동 (★한쪽만 건드리지 말 것) ────────────
#   ① tu_min_atr_percent / rg_min_atr_percent = 0.15 는 그대로 유지한다.
