# │   5m     │ 0.20    │  0.32  │ 0.07 │  0.06  │  0.35  │  1.00    │
# ├──────────┼─────────┼────────┼──────┼────────┼────────┼──────────┤
# │  【중기】 │         │        │      │        │        │          │
# │  10m     │ 0.26    │  0.28  │ 0.08 │  0.08  │  0.30  │  1.00    │
# │  15m     │ 0.30    │  0.26  │ 0.08 │  0.08  │  0.28  │  1.00    │
# │  30m     │ 0.32    │  0.24  │ 0.08 │  0.10  │  0.26  │  1.00    │
# ├──────────┼─────────┼────────┼──────┼────────┼────────┼──────────┤
# │  【장기】 │         │        │      │        │        │          │
# │   1h     │ 0.36    │  0.21  │ 0.08 │  0.11  │  0.24  │  1.00    │
# │   4h     │ 0.40    │  0.19  │ 0.07 │  0.12  │  0.22  │  1.00    │
