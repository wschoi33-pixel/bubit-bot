#   진입 17건 fwd20 · SL=max(0.20%, ATR×m) · TP=계획값 · SL 우선 · 틱 관통
#     m=1.0 승률  5.9% 평균 +0.024%   ← 직전 현행
#     m=1.2 승률  5.9% 평균 -0.014%   ← 08-05 값
#     m=2.0 승률 29.4% 평균 +0.224%
