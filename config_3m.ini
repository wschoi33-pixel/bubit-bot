#   ② 진입 ATR 상한 = max_entry_atr_sl_pct / atr_stop_loss_multiplier.
#      → multiplier 변경 시 기존 진입 모집단을 유지하려면 cap을 반드시 함께 동기화한다.
#      → 0.91 / 2.6 = 0.350% → 0.56 / 1.6 = 0.350% 로 동일하게 유지한다.
