# ========================================
# 3분봉 전용 설정
# ========================================
# 이 파일은 3분봉 매매의 "최종 실행 설정"이다.
#
# ConfigManager 병합 규칙:
# - config.ini 값이 존재하더라도
#   본 파일(config_3m.ini)의 값이 항상 우선 적용된다.
#
# 따라서:
# - 실제 매매 결과가 예상과 다를 경우
#   반드시 본 파일의 값을 기준으로 분석할 것.
# ============================================================

[TIMEFRAME_INFO]
# 메타 정보 (검증용)
timeframe = 3m
description = 초단타 전략 - 10-60분 보유
expected_trades_per_day = 15-30
risk_level = 높음
strategy_type = 스캘핑
holding_time_range = 10-60분
monitoring_required = 높음
suitable_for = 전업 트레이더, 빠른 회전 선호자

[TRADING]
# AS-IS
# 타임프레임별 최대 동시 포지션 수 - 필수 설정 ★★★
# 1m:  8-10개 (리스크 분산 극대화)
# 3m:  6-8개
# 5m:  5-7개  
# 10m: 4-6개
# 15m: 3-5개  (권장)
# 30m: 3-4개
# 1h:  2-3개
# 4h:  2-3개
# 1d:  1-2개 (집중 투자)
max_positions = 5
# TO-BE (글로벌 벤치마킹 기반)
# 타임프레임별 최대 동시 포지션 수 - 필수 설정 ★★★
# 1m:  4-5개  (과다 포지션 방지, BitMEX 스캘퍼 평균)
# 3m:  3-4개  (관리 가능 수준)
# 5m:  3-4개  (Binance 리더보드 평균)
# 10m: 3개    (집중 관리)
# 15m: 2-3개  (스윙 트레이딩 표준)
# 30m: 2개    (포지션 집중)
# 1h:  2개    (리스크 집중 관리)
# 4h:  1-2개  (헤지펀드 방식)
# 1d:  1개    (단일 포지션 집중)
# [개선사유] 글로벌 성공 트레이더 분석 결과:
# - Binance Futures 상위 100명: 평균 2.8개 포지션
# - 과다 포지션은 관리 불가 및 손실 확대 원인
# - 집중 투자가 암호화폐 시장에서 더 효과적

# AS-IS
# 타임프레임별 거래당 리스크 비율 - 필수 설정 ★★★
# 1m:  0.003-0.005 (0.3-0.5%)
# 3m:  0.004-0.006 (0.4-0.6%)
# 5m:  0.005-0.008 (0.5-0.8%)
# 10m: 0.006-0.010 (0.6-1.0%)
# 15m: 0.008-0.012 (0.8-1.2%)
# 30m: 0.010-0.015 (1.0-1.5%)
# 1h:  0.012-0.020 (1.2-2.0%)
# 4h:  0.015-0.025 (1.5-2.5%)
# 1d:  0.020-0.030 (2.0-3.0%)
risk_per_trade = 0.005
# TO-BE (Kelly Criterion & 글로벌 표준)
# 타임프레임별 거래당 리스크 비율 - 필수 설정 ★★★
# 1m:  0.002-0.003 (0.2-0.3%) - 고빈도 최소 리스크
# 3m:  0.003-0.005 (0.3-0.5%) - 빈도 고려 축소
# 5m:  0.008-0.010 (0.8-1.0%) - Kelly 최적값
# 10m: 0.010-0.012 (1.0-1.2%) - 표준 1% 룰
# 15m: 0.012-0.015 (1.2-1.5%) - 스윙 표준
# 30m: 0.015-0.018 (1.5-1.8%) - 중기 포지션
# 1h:  0.018-0.020 (1.8-2.0%) - 포지션 트레이딩
# 4h:  0.020-0.025 (2.0-2.5%) - 장기 표준
# 1d:  0.025-0.030 (2.5-3.0%) - 헤지펀드 수준
# [개선사유] 리스크 관리 글로벌 표준:
# - Kelly Criterion 최적 배팅: 승률 기반 1-2%
# - 단기일수록 낮은 리스크 (파산 방지)
# - 장기일수록 높은 리스크 허용 (수익 극대화)

# 타임프레임별 일일 최대 손실 한도 (원) - 필수 설정 ★★★
# 총 자산의 2-6% 권장 (1천만원 기준 예시)
# 1m:  총자산의 2.0-2.5%   (200,000-250,000원) → 권장: 0.023 (230,000원)
# 3m:  총자산의 2.3-2.8%   (230,000-280,000원) → 권장: 0.026 (260,000원)
# 5m:  총자산의 2.5-3.0%   (250,000-300,000원) → 권장: 0.028 (280,000원)
# 10m: 총자산의 2.8-3.2%   (280,000-320,000원) → 권장: 0.030 (300,000원)
# 15m: 총자산의 3.0-3.5%   (300,000-350,000원) → 권장: 0.032 (320,000원)
# 30m: 총자산의 3.2-4.0%   (320,000-400,000원) → 권장: 0.035 (350,000원)
# 1h:  총자산의 3.5-4.5%   (350,000-450,000원) → 권장: 0.040 (400,000원)
# 4h:  총자산의 4.0-5.5%   (400,000-550,000원) → 권장: 0.048 (480,000원)
# 1d:  총자산의 5.0-6.5%   (500,000-650,000원) → 권장: 0.055 (550,000원)
daily_max_loss_pct = 0.026

