# │ 타임프레임 │ 권장 임계값  │ 범위        │ 근거           │
# ├──────────────────────────────────────────────────────────┤
# │    1m     │   1.5%      │ 1.2~2.0%   │ 극심한 노이즈   │
# │    3m     │   0.3%      │ 0.3~0.5%   │ 초단타 조기탈출 ⭐   │
# │    5m     │   1.0%      │ 0.8~1.2%   │ 중간 노이즈     │
# │   10m     │   0.8%      │ 0.6~1.0%   │ 스캘핑 → 스윙   │
# │   15m     │   0.6%      │ 0.5~0.8%   │ 스윙 표준       │
# │   30m     │   0.5%      │ 0.4~0.6%   │ 중기 추세       │
# │    1h     │   0.4%      │ 0.3~0.5%   │ 명확한 추세     │
# │    4h     │   0.3%      │ 0.2~0.4%   │ 장기 추세       │
# │    1d     │   0.2%      │ 0.15~0.3%  │ 메이저 전환     │
# └──────────────────────────────────────────────────────────┘
breach_threshold = 0.10


# ========================================
# 16. 포지션 관리 설정 (신규) ★★★
# ========================================

[POSITION_MANAGEMENT]
# 손절 후 재매수 방지 쿨다운 (분) - 필수 설정 ★★★
# 같은 종목을 손절한 후 이 시간 동안 재매수 금지
# 무한 반복 매매 방지 및 감정적 거래 차단
# 
# 타임프레임별 권장:
# 1m:  5-10분   (빠른 회전, 짧은 쿨다운)
# 3m:  10-20분  (단기 패턴 완성 대기)
# 5m:  30-60분  (중단기 추세 재확인)
# 10m: 60-90분  (충분한 시장 변화)
# 15m: 60-120분 (스윙 패턴 재형성)
# 30m: 120-180분 (중기 추세 전환 대기)
# 1h:  240-480분 (4-8시간, 장기 추세)
# 4h:  480-960분 (8-16시간, 메이저 사이클)
# 1d:  1440-2880분 (1-2일, 완전한 사이클)
# 
# 시장 상황별 조정:
# - 상승장: 짧게 (기회 많음)
# - 횡보장: 길게 (같은 패턴 반복)
# - 하락장: 매우 길게 (추가 손실 방지)
cooldown_after_loss_minutes = 15

# 🔒 [BAR-OPEN-FRESH-RECHECK-0824]
# 3분봉 최초 BUY가 봉 시작 직후 발생하면 주문하지 않고,
# 해당 초 경과 후 가격/DF/MA/TLC/J1~J4를 fresh 재평가한다.
# 0 = 비활성
bar_open_guard_seconds = 60

# ========================================
# 29. 휩소(Whipsaw) 감지 설정
# ========================================

[WHIPSAW_DETECTION]
# 타임프레임별 룩백 캔들 수
# 1m~5m:  8-12개
# 10m~30m: 10-15개
# 1h~4h:   12-20개
# 1d:      15-25개
lookback_candles = 10

# 타임프레임별 최소 방향 전환 횟수
# 1m~5m:  4-6회
# 10m~30m: 5-7회
# 1h~4h:   6-8회
# 1d:      7-10회
min_direction_changes = 5

# 타임프레임별 변동성 임계값 (%)
# 1m~5m:  1.5-2.5%
# 10m~30m: 2.0-3.0%
# 1h~4h:   2.5-3.5%
# 1d:      3.0-4.0%
volatility_threshold_pct = 2.0

# ========================================
# 30. 지지/저항 설정
# ========================================

[SUPPORT_RESISTANCE]
# 타임프레임별 룩백 기간
# ⚠️ 이 값은 실제 박스권/지지저항 인식에 직접 사용됨 (SSoT)
# Trading_bot_5_analysis.MarketAnalyzer.identify_support_resistance()
# Trading_bot_6_strategy._generate_range_signal()
#
# [중요 원칙]
# - 박스권은 "국지 변동"이 아니라 "구조적 누적"으로 인식해야 함
# - 룩백이 짧을수록 노이즈 박스 오판 ↑ / 손절 빈도 ↑
#
# 3m 기준 권장값:
# - 40개 = 2시간 ❌ (국지 고저점 오판 위험 큼)
# - 60개 = 3시간 ⚠️ (여전히 짧음)
# - 80개 = 4시간 △ (중간 수준)
# - 120개 = 6시간 ✅ (구조적 박스권 인식, 권장)
#
# 타임프레임별 가이드:
# 1m~5m:   60~120개   (구조 인식 우선)
# 10m~30m: 80~150개
# 1h~4h:   100~200개
# 1d:      120~240개
#
# ⚠️ 단기 타이밍은 봉 단위(3m/5m)로 처리하고,
#    박스권/지지저항은 반드시 상위 구조 시야를 유지할 것
lookback_period = 120

# 타임프레임별 돌파 배수
# 1m~5m:  1.002-1.005 (0.2-0.5%)
# 10m~30m: 1.003-1.008 (0.3-0.8%)
# 1h~4h:   1.005-1.010 (0.5-1.0%)
# 1d:      1.008-1.015 (0.8-1.5%)
breakthrough_multiplier = 1.004

# Timeframe	권장 임계값	이유
# 1m	1.30 ~ 1.60	매우 변동성 크고 노이즈 많음
# 3m	0.70 ~ 0.90	단기 추세 포착, 현재 전략에서 최적
# 5m	1.00 ~ 1.30	완만한 변화를 반영
# 10m	1.50 ~ 1.80	박스권/횡보 더 명확
# 15m	1.50 ~ 2.00	기존 업비트 스타일과 잘 맞음
# 30m	1.70 ~ 2.20	포지션 단기 스윙 기반
# 1h	1.80 ~ 2.30	대세 전환 시 추세 확인 필요
# 4h	2.00 ~ 2.50	미들 스윙 트레이딩 적합
# 1d	2.20 ~ 3.00	중장기 추세 확인
volume_threshold = 0.80

# ========================================
# 31. 매집 패턴 설정
# ========================================

[ACCUMULATION_PATTERN]
# 타임프레임별 패턴 룩백
# 1m~5m:  5-10개
# 10m~30m: 8-12개
# 1h~4h:   10-15개
# 1d:      12-20개
pattern_lookback = 8

# 타임프레임별 거래량 급증 배수
# 1m~5m:  1.8-2.5배
# 10m~30m: 2.0-2.8배
# 1h~4h:   2.2-3.0배
# 1d:      2.5-3.5배
volume_surge_multiplier = 2.0

