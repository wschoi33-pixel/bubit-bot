# 
# 🎯 설계 철학:
# - "타이밍(BW/Volume)"은 단기일수록 높게
# - "추세확증(MA/ADX)"은 장기로 갈수록 높게
# - 3m ATR 가중치는 현행 0.20이며 실제 실행값은 아래 설정이 SSoT.
#
# 🔄 체제별 조정 (직접 감액 후 합계 1.00 재정규화):
# - TRENDING_UP/BREAKOUT: BW×0.95 → MA/Volume 등 상대비중 상승
# - TRENDING_DOWN:        Volume×0.75 → MA/ADX/BW(Bandwidth Weight) 등 상대비중 상승
# - RANGING/BREAKDOWN:    Volume×0.90 → MA/ADX/BW(Bandwidth Weight) 등 상대비중 상승
# - 별도 >1.0 직접 증폭은 사용하지 않음
#
# ┌──────────┬─────────┬────────┬──────┬────────┬────────┬──────────┐
# │timeframe │   MA    │ Volume │ ATR  │  ADX   │   BW   │ 합계      │
# ├──────────┼─────────┼────────┼──────┼────────┼────────┼──────────┤
# │  【단기】 │         │        │      │        │        │          │
