# └──────────┴─────────┴────────┴──────┴────────┴────────┴──────────┘
# 각 행의 합계: 1.00, ADX 제거. 옛 candle 축은 실제로 BW_PCT60(60봉 밴드폭 압축 백분위)이므로
# 2026-08-01 키 이름을 candle_signal_weight → bw_signal_weight 로 개명함(용어 혼동 제거)
# BW_PCT60의 장점: 지난 60봉 동안의 밴드폭을 백분위로 환산하여 무조건 0.00에서 1.00(또는 0~100%) 사이의 고정된 값
# 이 종목은 지금 역사적으로 변동성이 가장 수축된 상태구나(0에 가까움)" 혹은 "터지기 직전이구나(1에 가까움)"를 종목 가격과 상관없이 완벽하게 이해할 수 있게 만듭니다.
